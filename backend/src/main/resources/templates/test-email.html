<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Test email from Gymholic ✉️</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${name}">Admin</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            This is a test message sent from
            <strong>Admin → Integrations</strong> through the
            <strong th:text="${provider}">email provider</strong>.
            If you can read this, transactional email is working.
        </p>
        <p style="color: #666; font-size: 14px;">
            Sent at <span th:text="${sentAt}">now</span>.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
