app:
  paymob:
    api-key: ${PAYMOB_API_KEY:}
    integration-id: ${PAYMOB_INTEGRATION_ID:}
    iframe-id: ${PAYMOB_IFRAME_ID:}
    hmac-secret: ${PAYMOB_HMAC_SECRET:}
    public-key: ${PAYMOB_PUBLIC_KEY:}
  payments:
    # Optional override of the currency sent to Paymob (e.g. EGP for accounts
    # without USD collection). Empty = use the order currency (USD).
    currency: ${PAYMOB_CURRENCY:}
    # EGP per USD — converts USD amounts whenever the currency override above
    # is active, so a $49 order charges the correct EGP value, never EGP 49.
    egp-usd-rate: ${PAYMOB_EGP_USD_RATE:48.0}
  encryption:
    secret: ${ENCRYPTION_SECRET:fallback_secret_must_change_in_prod}
  jwt:
    secret: ${JWT_SECRET:default-secret-for-local-dev-only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 1 day by default
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  admin:
    bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}
    # Shared secret that gates the admin login endpoint (404 without it).
    access-key: ${ADMIN_ACCESS_KEY:}
  zoom:
    # Server-to-server OAuth credentials; when all three are set, confirmed
    # sessions get a real Zoom meeting instead of a Google Meet link.
    account-id: ${ZOOM_ACCOUNT_ID:}
    client-id: ${ZOOM_CLIENT_ID:}
    client-secret: ${ZOOM_CLIENT_SECRET:}
  mail:
    from: ${MAIL_FROM:noreply@gymholic.com}
    from-name: ${MAIL_FROM_NAME:Gymholic}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:Gymholic}
  twilio:
    # SMS + WhatsApp notifications (Admin → Integrations can also set these).
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
  auth:
    # One-time email codes on sign-up / sign-in; verified accounts are
    # required before any payment, order, cart or booking goes through.
    # Set EMAIL_VERIFICATION_REQUIRED=false only to recover/develop locally.
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}
  redirect:
    uri: ${GOOGLE_REDIRECT_URI:}
spring:
  application:
    name: gymholic-backend
  # Store uploads: cover images up to 5MB and product PDFs up to 25MB
  # (checked again in StoreService with friendlier error messages).
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 28MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis / Caching
  cache:
    type: redis

  # Jackson date handling
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

# Application configurations

# Actuator endpoints
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
