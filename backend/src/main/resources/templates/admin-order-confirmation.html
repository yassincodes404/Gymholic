<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">New Product Order 🛒</h1>
        <div style="background: #f0fdf4; border-left: 4px solid #22c55e; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0 0 8px 0; color: #14532d; font-weight: bold;">
                👤 <span th:text="${customerName}">Customer</span>
                &lt;<span th:text="${customerEmail}">customer@example.com</span>&gt;
            </p>
            <pre style="margin: 0; color: #14532d; font-family: inherit; white-space: pre-wrap;" th:text="${itemsList}">- Product ($49)</pre>
            <p style="margin: 12px 0 0 0; color: #14532d; font-weight: bold;">
                Total: <span th:text="${total}">$49</span>
            </p>
        </div>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">Gymholic — Your fitness journey starts here.</p>
    </div>
</body>
</html>
