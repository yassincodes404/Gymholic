name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    # Only deploy if the CI workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Determine the SHA to deploy. For workflow_run, it's the SHA that triggered the CI.
      # For workflow_dispatch, it's the current SHA.
      - name: Set IMAGE_TAG
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "IMAGE_TAG=sha-${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
            # Re-format to the 7-character short SHA used by docker/metadata-action
            echo "IMAGE_TAG=sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Deploy to Hostinger
        uses: hostinger/deploy-action@v1
        with:
          api_key: ${{ secrets.HOSTINGER_API_KEY }}
          vm_id: ${{ vars.HOSTINGER_VM_ID }}
          # Instead of running the whole project from source, we just pull the compose file
          # and then use it to pull the pre-built images.
          command: |
            echo "Deploying version $IMAGE_TAG"
            export IMAGE_TAG=$IMAGE_TAG
            # Note: This assumes docker-compose.prod.yml is already present on the server in the current directory.
            # Usually, deploy-action handles syncing the files first.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
