name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

# Queue production deploys instead of cancelling a mid-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if the CI workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Determine the SHA to deploy. For workflow_run, it's the SHA that triggered the CI.
      # For workflow_dispatch, it's the current SHA.
      - name: Set IMAGE_TAG
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            HEAD_SHA="${{ github.sha }}"
          fi
          echo "IMAGE_TAG=sha-${HEAD_SHA:0:7}" >> $GITHUB_ENV

      - name: Copy docker-compose.prod.yml to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "docker-compose.prod.yml,docker-compose.prod.hostinger.yml"
          target: "~/gymholic"

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            mkdir -p ~/gymholic
            cd ~/gymholic

            echo "Deploying version ${{ env.IMAGE_TAG }}"

            if [ ! -s .env ]; then
              echo "Missing ~/gymholic/.env on the VPS. Create it from .env.example with production values, then rerun this workflow."
              exit 1
            fi

            required_vars="POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD JWT_SECRET FRONTEND_URL MAIL_HOST MAIL_PORT"
            for var in $required_vars; do
              if ! grep -Eq "^${var}=.+" .env; then
                echo "Missing required variable in ~/gymholic/.env: ${var}"
                exit 1
              fi
            done

            cp .env .env.runtime
            printf "\nIMAGE_TAG=%s\n" "${{ env.IMAGE_TAG }}" >> .env.runtime

            if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            if ! docker network inspect traefik-proxy >/dev/null 2>&1; then
              echo "Missing external Docker network 'traefik-proxy'. Deploy the Hostinger Traefik project first."
              exit 1
            fi

            COMPOSE_FILES="-f docker-compose.prod.yml -f docker-compose.prod.hostinger.yml"

            # Pull with one retry — transient registry hiccups shouldn't fail the deploy.
            docker compose $COMPOSE_FILES --env-file .env.runtime pull || {
              echo "Pull failed once, retrying in 15s…"
              sleep 15
              docker compose $COMPOSE_FILES --env-file .env.runtime pull
            }

            docker compose $COMPOSE_FILES --env-file .env.runtime up -d --remove-orphans
            docker compose $COMPOSE_FILES --env-file .env.runtime ps

            # Spring Boot + Flyway migrations can take a while on small VPSes:
            # poll up to ~4 minutes before declaring the deploy failed.
            healthy=0
            for i in $(seq 1 48); do
              status="$(docker inspect --format='{{.State.Health.Status}}' gymholic-backend 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                healthy=1
                break
              fi
              if [ "$i" = "48" ]; then
                echo "Backend did not become healthy. Current status: ${status:-unknown}"
                docker compose $COMPOSE_FILES --env-file .env.runtime logs --tail=100 backend
                exit 1
              fi
              sleep 5
            done

            # Next.js starts fast, but give it a short grace period too.
            fe_healthy=0
            for i in $(seq 1 12); do
              status="$(docker inspect --format='{{.State.Health.Status}}' gymholic-frontend 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                fe_healthy=1
                break
              fi
              if [ "$i" = "12" ]; then
                echo "Frontend did not become healthy. Current status: ${status:-unknown}"
                docker compose $COMPOSE_FILES --env-file .env.runtime logs --tail=50 frontend
                exit 1
              fi
              sleep 5
            done

            docker compose $COMPOSE_FILES --env-file .env.runtime exec -T backend curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null
            docker compose $COMPOSE_FILES --env-file .env.runtime exec -T frontend wget -q --spider http://127.0.0.1:3000/
            echo "Deploy of ${IMAGE_TAG} completed successfully."
