spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gymholic}
    username: ${SPRING_DATASOURCE_USERNAME:gymholic}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: localhost
    port: 1025 # MailHog or similar for dev
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.gymholic: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# Dev-only mock payment provider (no real charges; completes via test endpoint)
app:
  payments:
    mock-enabled: true
