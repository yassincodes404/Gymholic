services:
  nginx:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.gymholic.rule=Host(`gymholic.ae`) || Host(`www.gymholic.ae`)
      - traefik.http.routers.gymholic.entrypoints=websecure
      - traefik.http.routers.gymholic.tls=true
      - traefik.http.routers.gymholic.tls.certresolver=letsencrypt
      - traefik.http.services.gymholic.loadbalancer.server.port=80
    networks:
      - gymholic-net
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
