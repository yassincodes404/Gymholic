<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Action Required: Complete Your Payment 💳</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${clientName}">Client</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            Your booking request with <strong th:text="${trainerName}">Trainer</strong> has been created successfully.
        </p>
        <div style="background: #f0f9ff; border-left: 4px solid #0ea5e9; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0; color: #0c4a6e; font-weight: bold;">
                📅 <span th:text="${dateTime}">Date & Time</span>
            </p>
        </div>
        <p style="color: #666; font-size: 14px;">
            To secure your slot, please complete the payment using the link below:
        </p>
        <div style="text-align: center; margin: 30px 0;">
            <a th:href="${paymentUrl}" style="background-color: #0ea5e9; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">Pay Now</a>
        </div>
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
