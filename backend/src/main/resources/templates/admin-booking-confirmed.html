<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Consultation Confirmed &amp; Paid 💰</h1>
        <p style="color: #333; font-size: 16px;">
            Payment was completed and the consultation is confirmed.
            The Google Calendar event has been created and the customer is invited.
        </p>
        <div style="background: #f0fdf4; border-left: 4px solid #22c55e; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0 0 8px 0; color: #14532d; font-weight: bold;">
                👤 <span th:text="${clientName}">Client</span>
                &lt;<span th:text="${clientEmail}">client@example.com</span>&gt;
            </p>
            <p style="margin: 0 0 8px 0; color: #14532d;">
                📅 <span th:text="${dateTime}">Date &amp; Time</span>
            </p>
            <p style="margin: 0 0 8px 0; color: #14532d;">
                💰 Paid: <strong><span th:text="${amount}">500</span> <span th:text="${currency}">AED</span></strong>
            </p>
            <p th:if="${meetLink != null and meetLink != ''}" style="margin: 0; color: #14532d;">
                🎥 <a th:href="${meetLink}" style="color: #16a34a; text-decoration: none;">Join Google Meet</a>
            </p>
        </div>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
