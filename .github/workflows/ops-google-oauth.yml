name: Ops — VPS google-oauth fix

# Diagnoses the failed Google Calendar token exchange (pulls the exact
# Google error from backend logs) and corrects FRONTEND_URL when it points
# at the raw IP instead of the domain (breaks OAuth redirects and the
# Paymob webhook/redirection URLs). Dispatch-only.

on:
  workflow_dispatch:

concurrency:
  group: ops-google
  cancel-in-progress: false

jobs:
  diagnose-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect logs and fix FRONTEND_URL on VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          timeout: 120s
          script: |
            set -e
            cd ~/gymholic

            echo "== FRONTEND_URL / GOOGLE_REDIRECT_URI (non-secret) =="
            grep -E '^(FRONTEND_URL|GOOGLE_REDIRECT_URI)=' .env || true

            echo "== backend log: google oauth errors =="
            docker logs --since 6h gymholic-backend 2>&1 | grep -iE 'token exchange|google|oauth|invalid_client|invalid_grant|redirect_uri' | tail -25 || echo "(no matching log lines)"

            if grep -qE '^FRONTEND_URL=https://186\.240\.157\.98' .env; then
              sed -i 's|^FRONTEND_URL=.*|FRONTEND_URL=https://gymholic.ae|' .env
              echo "FIXED: FRONTEND_URL -> https://gymholic.ae"
              TAG=$(grep -oE '^IMAGE_TAG=.+' .env.runtime 2>/dev/null | cut -d= -f2 || true)
              cp .env .env.runtime
              [ -n "$TAG" ] && printf 'IMAGE_TAG=%s\n' "$TAG" >> .env.runtime
              COMPOSE_FILES="-f docker-compose.prod.yml -f docker-compose.prod.hostinger.yml"
              docker compose $COMPOSE_FILES --env-file .env.runtime up -d --force-recreate backend
              for i in $(seq 1 48); do
                status="$(docker inspect --format='{{.State.Health.Status}}' gymholic-backend 2>/dev/null || true)"
                [ "$status" = "healthy" ] && { echo "backend healthy after fix"; break; }
                sleep 5
              done
            else
              echo "FRONTEND_URL already correct — no change"
            fi
