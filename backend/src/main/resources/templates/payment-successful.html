<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Payment Successful! 🎉</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${clientName}">Client</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            We have received your payment of <strong th:text="${amount}">0.00</strong> <strong th:text="${currency}">USD</strong>.
        </p>
        <div style="background: #f0f9ff; border-left: 4px solid #0ea5e9; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0; color: #0c4a6e; font-weight: bold;">
                Order ID: <span th:text="${orderId}">123456</span>
            </p>
        </div>
        <p style="color: #666; font-size: 14px;">
            Your booking is now confirmed. You will receive a separate email with your Google Meet link and consultation details shortly.
        </p>
        <p style="color: #999; font-size: 12px; text-align: center; margin-top: 30px;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
