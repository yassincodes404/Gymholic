<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Session Reminder ⏰</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${name}">Name</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            This is a reminder that your session with
            <strong th:text="${trainerName}">Trainer</strong> is coming up.
        </p>
        <div style="background: #fefce8; border-left: 4px solid #eab308; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0; color: #854d0e; font-weight: bold;">
                📅 <span th:text="${dateTime}">Date & Time</span>
            </p>
        </div>
        <div th:if="${meetLink != ''}" style="text-align: center; margin: 24px 0;">
            <a th:href="${meetLink}"
               style="display: inline-block; background: #0ea5e9; color: #ffffff; padding: 12px 32px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                Join Google Meet
            </a>
        </div>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
