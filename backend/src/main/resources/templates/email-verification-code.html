<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Confirm your email 🔐</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${name}">there</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            Use the code below to confirm your sign-in. It expires in
            <strong th:text="${expiresMinutes}">10</strong> minutes.
        </p>
        <div style="text-align: center; margin: 32px 0;">
            <span th:text="${code}"
                  style="display: inline-block; background: #1a1a1a; color: #ffffff; font-size: 32px; letter-spacing: 10px; font-weight: bold; padding: 16px 28px; border-radius: 8px;">000000</span>
        </div>
        <p style="color: #666; font-size: 14px;">
            If you didn't try to sign in to Gymholic, you can safely ignore
            this email — nothing will happen to your account.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
