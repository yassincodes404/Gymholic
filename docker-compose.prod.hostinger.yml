# Traefik wiring for the Hostinger VPS deployment.
#
# Traefik (infra/traefik, external project) routes directly to the
# containers — no nginx hop. API paths go to the backend, everything
# else to the Next.js frontend.
services:
  frontend:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.gymholic-frontend.rule=Host(`gymholic.ae`) || Host(`www.gymholic.ae`)
      - traefik.http.routers.gymholic-frontend.entrypoints=websecure
      - traefik.http.routers.gymholic-frontend.tls=true
      - traefik.http.routers.gymholic-frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.gymholic-frontend.priority=1
      - traefik.http.routers.gymholic-frontend.middlewares=gymholic-secure-headers
      - traefik.http.services.gymholic-frontend.loadbalancer.server.port=3000
      # Security headers shared by both routers (defined once here)
      - traefik.http.middlewares.gymholic-secure-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.gymholic-secure-headers.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN
    networks:
      - gymholic-net
      - traefik-proxy

  backend:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.gymholic-backend.rule=(Host(`gymholic.ae`) || Host(`www.gymholic.ae`)) && (PathPrefix(`/api`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`))
      - traefik.http.routers.gymholic-backend.entrypoints=websecure
      - traefik.http.routers.gymholic-backend.tls=true
      - traefik.http.routers.gymholic-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.gymholic-backend.priority=100
      - traefik.http.routers.gymholic-backend.middlewares=gymholic-secure-headers
      - traefik.http.services.gymholic-backend.loadbalancer.server.port=8080
    networks:
      - gymholic-net
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
