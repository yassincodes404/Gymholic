<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Your sign-in code</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${name}">Name</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            Use this one-time code to sign in to Gymholic:
        </p>
        <div style="text-align: center; margin: 32px 0;">
            <span style="display: inline-block; font-size: 36px; letter-spacing: 10px; font-weight: bold; color: #1a1a1a; background: #f5f5f5; padding: 16px 28px; border-radius: 8px;"
                  th:text="${code}">123456</span>
        </div>
        <p style="color: #666; font-size: 14px;">
            The code expires in <span th:text="${expiresMinutes}">10</span> minutes and can only
            be used once. If you didn't try to sign in, you can safely
            ignore this email.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
