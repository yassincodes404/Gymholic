<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">New Booking Received 📥</h1>
        <p style="color: #333; font-size: 16px;">
            A new consultation was just booked and is <strong>awaiting payment</strong>.
        </p>
        <div style="background: #fffbeb; border-left: 4px solid #f59e0b; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0 0 8px 0; color: #92400e; font-weight: bold;">
                👤 <span th:text="${clientName}">Client</span>
                &lt;<span th:text="${clientEmail}">client@example.com</span>&gt;
            </p>
            <p style="margin: 0 0 8px 0; color: #92400e;">
                📅 <span th:text="${dateTime}">Date &amp; Time</span>
            </p>
            <p style="margin: 0; color: #92400e;">
                💰 <span th:text="${amount}">500</span> <span th:text="${currency}">AED</span>
            </p>
        </div>
        <p style="color: #666; font-size: 14px;">
            You will receive another email once payment is completed and the
            consultation is confirmed.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
