<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Booking Rescheduled 📅</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${clientName}">Client</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            Your session with <strong th:text="${trainerName}">Trainer</strong> has been rescheduled.
        </p>
        <div style="background: #fffbeb; border-left: 4px solid #f59e0b; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0; color: #92400e; margin-bottom: 8px; text-decoration: line-through;">
                Old Time: <span th:text="${oldDateTime}">Date & Time</span>
            </p>
            <p style="margin: 0; color: #92400e; font-weight: bold; margin-bottom: 8px;">
                New Time: <span th:text="${newDateTime}">Date & Time</span>
            </p>
            <p style="margin: 0; color: #92400e;">
                🎥 <a th:href="${meetLink}" style="color: #f59e0b; text-decoration: none;">Join Google Meet</a>
            </p>
        </div>
        <p style="color: #666; font-size: 14px;">
            Your Google Calendar event has been automatically updated.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
