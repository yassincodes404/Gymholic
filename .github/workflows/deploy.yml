name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    # Only deploy if the CI workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Determine the SHA to deploy. For workflow_run, it's the SHA that triggered the CI.
      # For workflow_dispatch, it's the current SHA.
      - name: Set IMAGE_TAG
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "IMAGE_TAG=sha-${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
            # Re-format to the 7-character short SHA used by docker/metadata-action
            echo "IMAGE_TAG=sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            echo "Deploying version ${{ env.IMAGE_TAG }}"
            
            # Create a .env file containing the image tag dynamically
            echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" > .env.deploy
            
            # Pull and restart using the tag
            docker compose -f docker-compose.prod.yml --env-file .env.deploy pull
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d
