<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Booking Cancelled ❌</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${name}">Name</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            Your booking scheduled for <strong th:text="${dateTime}">Date & Time</strong>
            has been cancelled.
        </p>
        <div style="background: #fef2f2; border-left: 4px solid #ef4444; padding: 16px; margin: 24px 0; border-radius: 4px;">
            <p style="margin: 0; color: #991b1b;">
                <strong>Reason:</strong> <span th:text="${reason}">Reason</span>
            </p>
        </div>
        <p style="color: #666; font-size: 14px;">
            If you'd like to rebook, please visit your dashboard.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
