app:
  paymob:
    api-key: ${PAYMOB_API_KEY:}
    integration-id: ${PAYMOB_INTEGRATION_ID:}
    iframe-id: ${PAYMOB_IFRAME_ID:}
    hmac-secret: ${PAYMOB_HMAC_SECRET:}
  encryption:
    secret: ${ENCRYPTION_SECRET:fallback_secret_must_change_in_prod}
  jwt:
    secret: ${JWT_SECRET:default-secret-for-local-dev-only}
    expiration-ms: 86400000 # 1 day
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_USERNAME:noreply@gymholic.com}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}
spring:
  application:
    name: gymholic-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis / Caching
  cache:
    type: redis

  # Jackson date handling
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

# Application configurations

# Actuator endpoints
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
