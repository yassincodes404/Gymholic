<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h1 style="color: #1a1a1a; margin-bottom: 24px;">Reset Your Password 🔐</h1>
        <p style="color: #333; font-size: 16px;">
            Hi <span th:text="${name}">Name</span>,
        </p>
        <p style="color: #333; font-size: 16px;">
            We received a request to reset your password. Click the button below
            to create a new password.
        </p>
        <div style="text-align: center; margin: 32px 0;">
            <a th:href="${resetLink}"
               style="display: inline-block; background: #7c3aed; color: #ffffff; padding: 12px 32px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                Reset Password
            </a>
        </div>
        <p style="color: #666; font-size: 14px;">
            This link will expire in 1 hour. If you didn't request a password reset,
            you can safely ignore this email.
        </p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
        <p style="color: #999; font-size: 12px; text-align: center;">
            Gymholic — Your fitness journey starts here.
        </p>
    </div>
</body>
</html>
